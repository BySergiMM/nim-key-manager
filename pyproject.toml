[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nim-key-manager"
dynamic = ["version"]  # single source of truth: app/__init__.py (see [tool.hatch.version])
description = "Production-grade manager for NVIDIA Build/NIM API keys: encrypted storage, assisted rotation, expiry detection, usage stats, RBAC, audit and a Claude MCP connector."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sergi Martí" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",  # CIDR ranges in --forwarded-allow-ips (scripts/entrypoint.sh)
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "pwdlib[argon2]>=0.2",
    "cryptography>=42.0",
    "slowapi>=0.1.9,<0.2",  # app/api/rate_limit.py calls its private _check_request_limit
    "structlog>=24.1",
    "prometheus-fastapi-instrumentator>=7.0",
    "httpx>=0.27",
    "APScheduler>=3.10,<4",
    "email-validator>=2.1",
    "fastmcp>=3.4,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
# SQLAlchemy asyncio bridges sync ORM internals through greenlets;
# without this, code awaited across the greenlet boundary is not traced.
concurrency = ["greenlet", "thread"]
omit = ["app/tasks/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
exclude = ["alembic/versions"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["alembic/"]

# Deprecated 3.0 (pulled in by slowapi -> limits) needs Python >= 3.12 and uses the
# PEP 695 `type` statement, which mypy cannot parse while python_version is 3.10.
# Nothing in app/ depends on its types, so do not follow the import into it.
[[tool.mypy.overrides]]
module = ["deprecated", "deprecated.*"]
follow_imports = "skip"
